<title>อาคมหมอผี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* layout: full-bleed WebGL stage; HUD floats on top — title top-left, skill card right, skill bar bottom */
:root{
  --night:#070d0c; --panel:rgba(9,20,17,.82); --line:rgba(160,220,180,.18);
  --text:#e6efe4; --muted:#9fb5a6; --herb:#8fe39a; --gold:#e8c46a; --ember:#ff9a4a; --mpblue:#7cc4ff;
  --display:"Srisakdi","Anuphan",serif; --body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--text);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#dim{position:absolute;inset:0;background:#02040a;opacity:0;transition:opacity .25s;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hp{position:absolute;width:46px;height:5px;margin-left:-23px;background:rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.8);border-radius:2px}
.hp i{display:block;height:100%;background:var(--herb);transition:width .25s}
.hp.mob i{background:#e2574c}
.hp.down{opacity:.45}
.pop{position:absolute;font-weight:600;font-size:17px;white-space:nowrap;transform:translate(-50%,0);text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.8);animation:rise 1.25s ease-out forwards;font-variant-numeric:tabular-nums}
.pop.heal{color:#9dffaa}.pop.dmg{color:#fff3d6}.pop.hurt{color:#ff7d6e;font-size:14px}.pop.mp{color:var(--mpblue)}.pop.st{color:var(--gold);font-size:14px}.pop.big{font-size:24px}
@keyframes rise{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}12%{opacity:1;transform:translate(-50%,0) scale(1.15)}25%{transform:translate(-50%,-6px) scale(1)}100%{opacity:0;transform:translate(-50%,-46px)}}
.combo{position:absolute;transform:translate(-50%,-50%);font:600 22px var(--body);color:var(--gold);white-space:nowrap;text-shadow:0 2px 0 #000,0 0 10px rgba(160,230,80,.6);pointer-events:none;font-variant-numeric:tabular-nums}
.combo.bump{animation:bump .25s ease-out}
@keyframes bump{0%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(1)}}
.castbar{position:absolute;width:70px;height:6px;margin-left:-35px;background:rgba(0,0,0,.6);border:1px solid var(--gold);border-radius:3px}
.castbar i{display:block;height:100%;background:var(--gold)}

.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;pointer-events:none}
.brand .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--herb)}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,42px);line-height:1.15;margin:2px 0 2px;color:var(--gold);text-shadow:0 0 18px rgba(232,196,106,.35)}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.toggles{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap}
.toggles button{font:500 13px var(--body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.toggles button[aria-pressed="true"]{color:var(--night);background:var(--herb);border-color:var(--herb)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#info{position:absolute;right:16px;top:110px;width:270px;max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;backdrop-filter:blur(6px)}
#info .head{display:flex;gap:10px;align-items:center}
#info img{width:40px;height:40px;image-rendering:pixelated;border:1px solid var(--line);border-radius:6px}
#info h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.2;color:var(--text)}
#info .lv{font-size:12px;color:var(--muted)}
#info .meta{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 8px}
#info .meta span{font-size:11.5px;padding:2px 7px;border-radius:4px;background:rgba(143,227,154,.1);color:var(--herb);font-variant-numeric:tabular-nums}
#info .desc{font-size:13px;line-height:1.6;color:var(--text);margin:0 0 10px}
#info h3{font-size:11.5px;letter-spacing:.1em;color:var(--gold);margin:0 0 4px;font-weight:600}
#info ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.55;color:var(--muted)}

#bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;padding-inline:16px}
#bar .row{display:flex;gap:6px;overflow-x:auto;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:100%}
#bar .sep{width:1px;background:var(--line);margin:4px 2px;flex:none}
.sk{position:relative;flex:none;width:54px;height:54px;border-radius:8px;border:1px solid var(--line);background:#0e1d18;cursor:pointer;padding:0}
.sk img{width:44px;height:44px;image-rendering:pixelated;display:block;margin:auto}
.sk .k{position:absolute;left:3px;top:1px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.sk .l{position:absolute;right:3px;bottom:1px;font-size:9.5px;color:var(--gold)}
.sk.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(232,196,106,.45)}
.sk.adv{background:#18160d}
.sk .nw{position:absolute;right:-4px;top:-7px;font-size:9.5px;font-weight:600;padding:0 4px;border-radius:4px;background:var(--gold);color:var(--night)}
#tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);padding:3px 10px;border-radius:20px;white-space:nowrap}
#err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted)}

@media (max-width:760px){
  #info{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);right:16px;left:16px;width:auto;padding:10px 12px}
  #info ul,#info h3{display:none}
  #info .desc{margin:0;font-size:12.5px}
  #info .meta{margin:6px 0}
  #tip{display:none}
  .brand p{display:none}
}
@media (prefers-reduced-motion:reduce){.pop{animation-duration:.01s}}

<div id="app">
  <canvas id="cv"></canvas>
  <div id="dim"></div>
  <div id="labels"></div>
  <header class="hud-top">
    <div class="brand">
      <div class="eyebrow">สายอาชีพ · หมอผี (จอมขมังเวทย์)</div>
      <h1>อาคมหมอผี</h1>
      <p>ตัวอย่างเอฟเฟกต์สกิลด้วย three.js · ตัวละครและผีใช้สไปรต์จริงจากเกม</p>
    </div>
    <div class="toggles">
      <button id="tAuto" aria-pressed="true">เล่นวนทุกสกิล</button>
      <button id="tSlow" aria-pressed="false">สโลว์ ×0.35</button>
      <button id="tBloom" aria-pressed="true">แสงฟุ้ง</button>

  </header>
  <aside id="info" aria-live="polite">
    <div class="head"><img id="iIcon" alt=""><div><h2 id="iName"></h2><div class="lv" id="iLv"></div></div></div>
    <div class="meta" id="iMeta"></div>

    <ul id="iLayers"></ul>
  </aside>
  <div id="tip">กดไอคอนหรือปุ่ม 1–0 เพื่อร่าย · ผีจะตีแนวหน้าเรื่อย ๆ</div>
  <nav id="bar"><div class="row" id="barRow"></div></nav>

</div>

    for (let k = 0; k < 3; k++) { const a = t * 5 + k * 2.09, h = (t * 1.2 + k * .33) % 1.8; emit({ p: hero.pos.clone().add(V(Math.cos(a + h * 2) * .55, h + hero.off.y, Math.sin(a + h * 2) * .4)), v: V(0, .4, 0), c: k ? EMBER : C(2.6, 1.8, .6), life: .45, size: .12, size1: .02 }); }
    for (let k = 0; k < 2; k++) { const a = rand(0, 6.28); emit({ p: head.clone().add(V(Math.cos(a) * .42, Math.sin(a) * .42, 0)), v: V(0, .5, 0), c: FIRE, life: .35, size: .12, size1: .02 }); }
    if (t > 3.4) { hero.off.y = 0; kill(ring); kill(disc); return false; }
  });
  return 3.6;
}

/* 10 · พายุอัสนีเทพ — a black storm wheel forms overhead, sky-arcs crawl cloud to cloud, then five rounds of forked bolts hammer every ghost around the shaman */
function skStorm() {
  const P = hero.pos.clone(); P.y = 0; const R = 4.25; face(hero, nearestGhost().pos);
  castAnim(9, () => tipFlash(C(.8, 1.2, 2.8)), 3, 'spell');
  const dark = $('dim'); dark.style.opacity = '.3';
  const wheel = decal(1, P.x, P.z, R, C(.6, .9, 2.2), null, { auto: false, alpha: .55 });
  let arcT = .2;
  addTask((dt, t) => {
    if (t < 2.7 && Math.random() < .8) emit({ p: V(P.x + rand(-R, R), 4.7 + rand(-.3, .3), P.z + rand(-R, R) * .8), v: V(rand(-.3, .3), 0, rand(-.3, .3)), c: C(.1, .12, .22), life: 1.4, size: rand(1.2, 1.8), size1: 2.2, shape: SH.soft, a: .75, swirl: .35 }, PN);
    arcT -= dt; if (t < 2.6 && arcT <= 0) { arcT = rand(.12, .3); const a = V(P.x + rand(-R, R), 4.6, P.z + rand(-R, R) * .7), b = a.clone().add(V(rand(-2.5, 2.5), rand(-.4, .2), rand(-1.5, 1.5)));
      lightning(a, b, { w: .04, branches: 2, life: .18, blen: .6, disp: .3, haze: .9 }); }
    wheel.u.uAlpha.value = .55 * clamp01(t * 3) * clamp01((3 - t) / .4);
    if (t > 3) { wheel.auto = true; wheel.t = 99; dark.style.opacity = '0'; return false; }
  });
  for (let w = 0; w < 5; w++) after(.55 + w * .25, () => {
    const tg = livingGhosts().filter(g => g.pos.distanceTo(P) <= R + .4);
    const spots = tg.map(g => g.pos.clone()); for (let k = spots.length; k < 4; k++) { const a = rand(0, 6.28), r = rand(1.2, R); spots.push(V(P.x + Math.cos(a) * r, 0, P.z + Math.sin(a) * r)); }
    spots.forEach((s, i) => after(i * .035, () => {
      if (w === 0) crackleTree(s.clone(), .2, 1.1);
      lightning(V(s.x + rand(-.5, .5), 4.6, s.z + rand(-.3, .3)), V(s.x, 0, s.z), { w: .08, branches: 6, life: .32, blen: 1.1 });
      boltImpact(V(s.x, 0, s.z), .85);
    }));
    flash(P, 0xa8c4ff, 60, .3); shake = .15;
    tg.forEach(g => { hurt(g, 175, w === 4, .2); stunStars(g, .4); });
  });
  return 3.2;
}

/* ---------------- resize / loop ---------------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h;
  camDist = w / h < 1 ? 1.55 : w / h < 1.3 ? 1.2 : 1; camera.updateProjectionMatrix();
  const us = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))); PA.mat.uniforms.uScale.value = us; PN.mat.uniforms.uScale.value = us;
}
addEventListener('resize', resize);
const clock = new THREE.Clock(); let time = 0;
function frame() {
  const raw = Math.min(clock.getDelta(), 1 / 20), dt = raw * (slow ? .35 : 1); time += dt;
  const camPos = V(Math.sin(time * .05) * .8, 9.6, 11.2).multiplyScalar(camDist);
  camera.position.copy(camPos).add(camLook);
  if (shake > 0) { camera.position.add(V(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(shake)); shake = Math.max(0, shake - raw * .9); }
  camera.lookAt(camLook);
  for (let i = tasks.length - 1; i >= 0; i--) { const k = tasks[i]; k.t += dt; if (k.fn(dt, k.t) === false) tasks.splice(i, 1); }
  ghostAI(dt);
  /* ambient fireflies */
  if (Math.random() < dt * 5) emit({ p: V(rand(-9, 9), rand(.4, 2.5), rand(-8, 4)), v: V(rand(-.2, .2), rand(-.1, .1), rand(-.2, .2)), c: C(1.1, 1.6, .5), life: rand(2, 4), size: rand(.05, .08), a: .8 });
  actors.forEach(a => stepActor(a, dt));
  stepPS(PA, dt); stepPS(PN, dt); stepDecals(dt, time); stepLights(dt);
  if (autoOn) { autoClock -= dt; if (autoClock <= 0) cast((current + 1) % SKILLS.length); }
  composer.render();
  requestAnimationFrame(frame);
}
