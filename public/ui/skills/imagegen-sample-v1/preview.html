<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตัวอย่างไอคอนสกิล</title><style>
*{box-sizing:border-box}body{margin:0;background:#102820;color:#f5e8c4;font-family:Tahoma,sans-serif}main{max-width:1080px;margin:auto;padding:26px}h1{font-size:28px;margin:0 0 10px}header p{color:#c4d0bb;line-height:1.65;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:linear-gradient(145deg,#213d30,#10281f);border:1px solid #98733d;border-radius:14px;padding:20px;text-align:center}h2{font-size:20px;margin:10px 0 6px}.desc{font-size:14px;color:#c4d0bb;margin:0;min-height:43px;line-height:1.6}.frame{display:inline-block;border:1px solid #d1b574;border-radius:12%;background:radial-gradient(circle at 40% 30%,#375547,#11281f);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px #14271e}.frame img{display:block;width:100%;height:100%;object-fit:contain}.hero{width:192px;height:192px}.sizes{display:flex;align-items:end;justify-content:center;gap:20px;margin-top:12px}.sizes label{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#c6cbb8}.old{image-rendering:pixelated}.s32{width:32px;height:32px}.s48{width:48px;height:48px}.s64{width:64px;height:64px}.compare{border-left:1px solid #6c6945;padding-left:17px}footer{color:#b9c7b1;font-size:13px;line-height:1.65;margin-top:18px}@media(max-width:650px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}.card{padding:18px}}
.frame img:not(.old){padding:5%}
.frame img.old{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:fill}
</style></head><body><main><header><h1>ตัวอย่างไอคอนสกิล</h1><p>สร้างด้วย ImageGen · ลายไทยเฉพาะจุด · ลองดูทั้งภาพใหญ่และขนาดช่องสกิล</p></header><section class="grid" id="samples"></section><footer>รอบนี้เป็นตัวอย่าง 4 สกิล ยังไม่ได้เปลี่ยนภาพในเกมหรือค่าของสกิล</footer></main><script>
const samples=[['sword_twin','ฟันดาบคู่','นักรบ · ดาบสองเล่มฟันไขว้ 3 ครั้ง','warrior'],['arch_quick','ศรคู่ฉับไว','นายพราน · ศรสองดอกพุ่งเข้าเป้าเดียว','hunter'],['mage_akom','กระสุนวิญญาณ','หมอผี · กะโหลกวิญญาณสามดวงโค้งเข้าเป้า','shaman'],['heal_khwan','พิธีสู่ขวัญ','หมอยา · บายศรีรักษาปาร์ตี้และชุบชีวิต','herbalist']];
document.querySelector('#samples').innerHTML=samples.map(([id,name,desc,cls])=>`<article class="card"><span class="frame hero"><img src="${id}.webp" alt="${name}"></span><h2>${name}</h2><p class="desc">${desc}</p><div class="sizes">${[32,48,64].map(size=>`<label><span class="frame s${size}"><img src="${id}.webp" alt=""></span>${size}px</label>`).join('')}<label class="compare"><span class="frame s48"><img class="old" src="/fx/${cls}/icon_${id}.png" alt="ภาพเดิม"></span>เดิม</label></div></article>`).join('');
</script></body></html>
