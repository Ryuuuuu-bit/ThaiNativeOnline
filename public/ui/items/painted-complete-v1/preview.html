<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ภาพไอเทมลายไทย — ชุดเต็ม</title>
<style>
@font-face{font-family:Thai;src:url('/fonts/ibm-plex-sans-thai-looped-thai-400-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#0b211a;color:#f0e0b4;font-family:Thai,sans-serif}header{padding:28px max(20px,calc((100vw - 1320px)/2));background:#103025;border-bottom:1px solid #b99a54}h1{font-size:28px;margin:0 0 10px}p{margin:6px 0;color:#cfc8ab}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}select,input,button{font:inherit;background:#173b2c;color:#f0dfae;border:1px solid #a58a4d;border-radius:6px;padding:8px 12px}input{flex:1;min-width:160px}.grid{max-width:1360px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#123026;border:1px solid #786632;border-radius:10px;padding:14px;text-align:center}.art{height:160px;display:grid;place-items:center;background:#082017;border-radius:6px}.art img{width:150px;height:150px;object-fit:contain}.sizes{height:80px;display:flex;justify-content:center;align-items:center;gap:16px}.sizes img{object-fit:contain}.card h2{font-size:16px;line-height:1.5;margin:8px 0}.card p{font-size:12px}.light .art,.light .sizes{background:#e7dfcc}.checker .art,.checker .sizes{background:repeating-conic-gradient(#24352d 0 25%,#3d4b42 0 50%) 0/20px 20px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffe3a1;outline-offset:3px}@media(max-width:440px){h1{font-size:23px}.grid{grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}.card{padding:8px}.art{height:120px}.art img{width:110px;height:110px}.sizes{gap:7px}.sizes img:last-child{display:none}}
</style>
<header><h1>ภาพไอเทมลายไทย — ชุดเต็ม</h1><p id="progress" aria-live="polite">กำลังอ่านรายการภาพ…</p><p>ภาพที่เพิ่งสร้างยังรอตรวจความถูกต้องก่อนนำเข้าเกม</p><div class="controls"><select id="category" aria-label="ประเภท"><option value="all">ทุกประเภท</option><option value="equip">อุปกรณ์</option><option value="flask">ขวดพิเศษ</option><option value="card">การ์ดมอนสเตอร์</option><option value="material">วัตถุดิบ</option><option value="use">ของใช้</option></select><input id="search" placeholder="ค้นหาชื่อไอเทม" aria-label="ค้นหาชื่อไอเทม"><select id="background" aria-label="พื้นหลัง"><option value="">หยก</option><option value="light">พื้นสว่าง</option><option value="checker">ตรวจพื้นโปร่งใส</option></select><button id="reload">อัปเดตรายการ</button></div></header><main class="grid" id="grid"></main>
<script type="module">
let data;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const category=document.querySelector('#category').value,query=document.querySelector('#search').value.toLowerCase();document.querySelector('#grid').innerHTML=data.items.filter(item=>(category==='all'||item.type===category)&&item.name.toLowerCase().includes(query)).map(item=>`<article class="card"><div class="art"><img loading="lazy" src="${esc(item.image)}" alt="${esc(item.name)}"></div><div class="sizes">${[32,48,64].map(size=>`<img loading="lazy" src="${esc(item.image)}" width="${size}" height="${size}" alt="${size} พิกเซล">`).join('')}</div><h2>${esc(item.name)}</h2><p>${item.levels.length?`Lv.${item.levels.join(' / ')} · `:''}${esc(item.status)}</p></article>`).join('')}
async function load(){data=await fetch(`preview-manifest.json?t=${Date.now()}`).then(response=>response.json());const s=data.summary;document.querySelector('#progress').textContent=`สร้างใหม่ ${s.completedNewMasters} / ${s.plannedNewMasters} ภาพ · ภาพเดิมที่อนุมัติ ${s.reusedApprovedMasters} ภาพ · ครอบคลุม ${s.mappedIDs} / ${s.activeIDs} ไอเทม`;render()}
document.querySelector('#category').onchange=render;document.querySelector('#search').oninput=render;document.querySelector('#background').onchange=event=>document.body.className=event.target.value;document.querySelector('#reload').onclick=load;load();
</script></html>
