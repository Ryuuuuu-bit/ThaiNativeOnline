<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>วิชาแห่งอโยธยา</title><style>
*{box-sizing:border-box}body{margin:0;background:#102820;color:#f5e8c4;font-family:Tahoma,sans-serif}main{max-width:1320px;margin:auto;padding:24px}h1{margin:0 0 12px;font-size:28px}header p,footer{color:#b8c9b4;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button{padding:10px 16px;border:1px solid #9e7a40;border-radius:8px;background:#203b2e;color:#f5e8c4;cursor:pointer}button[aria-pressed=true]{background:#6d5330;color:#fff3d4}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{min-width:0;background:linear-gradient(140deg,#254433,#11281f);border:1px solid #94743e;border-radius:12px;padding:14px;text-align:center}.frame{display:inline-block;width:100%;height:100%;overflow:hidden;border:1px solid #c5a35b;border-radius:12%;background:#193c2c}.frame img{display:block;width:100%;height:100%;object-fit:contain}.hero{width:128px;height:128px}h2{font-size:15px;line-height:1.5;min-height:44px;margin:12px 0 5px}.type{color:#c7b585;font-size:12px}.sizes{display:flex;justify-content:center;align-items:end;gap:10px;margin:12px 0 0}.sizes label{font-size:10px;color:#bccab4;display:flex;flex-direction:column;align-items:center;gap:6px}.s32{width:32px;height:32px}.s48{width:48px;height:48px}.s64{width:64px;height:64px}footer{margin-top:24px;font-size:13px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:10px 5px}.hero{width:112px;height:112px}.sizes{gap:6px}.s64{width:48px;height:48px}h1{font-size:24px}.sizes label:last-child{display:none}}
</style></head><body><main><header><h1>วิชาแห่งอโยธยา</h1><p>สกิลทั้ง 5 อาชีพ · ภาพวาดแฟนตาซีไทยพร้อมฉากหลังเฉพาะวิชา</p></header><nav></nav><section class="grid"></section><footer>สกิลใช้งาน 50 วิชา · สกิลติดตัว 15 วิชา</footer></main><script>
const skills=[{"id":"boxer_jab","cls":"muaythai","name":"หมัดแย็บ","desc":"แย็บรัว 3 หมัด","passive":false},{"id":"boxer_kick","cls":"muaythai","name":"เตะก้านคอ","desc":"เตะก้านคอเต็มแรง ทำให้มึนงง 0.7 วิ","passive":false},{"id":"boxer_croc","cls":"muaythai","name":"จระเข้ฟาดหาง","desc":"หมุนตัวเตะกลับหลัง โดนทุกตัวรอบตัว 2 ครั้ง","passive":false},{"id":"boxer_waikru","cls":"muaythai","name":"ไหว้ครูรำมวย","desc":"ฟื้น HP 10% พลังโจมตี +25% ตีเร็วขึ้น 10% นาน 12 วิ","passive":false},{"id":"boxer_ngouy","cls":"muaythai","name":"หักงวงไอยรา","desc":"รับขาแล้วทุ่มศอกลงต้นขา โจมตีหนักและทำให้มึนงง 1.5 วิ","passive":false},{"id":"boxer_drum","cls":"muaythai","name":"กลองมังคละปลุกใจ","desc":"[ปาร์ตี้] ตีกลองศึก 3 จังหวะ ฟื้น HP 10% · ป้องกัน +18 โจมตี +10% ทั้งปาร์ตี้ 12 วิ","passive":false},{"id":"boxer_elbow","cls":"muaythai","name":"ศอกกลับพลิกล็อก","desc":"ศอกตัดแล้วพลิกศอกเดิมฟาดกลับ ผีสะดุ้งและคมศอกบาดจนเลือดไหลต่อเนื่อง","passive":false},{"id":"boxer_knee","cls":"muaythai","name":"เข่าลอยทะลวงฟ้า","desc":"กระโดดเข่าลอยเข้าหาเป้า ผีรอบจุดลงมึน 0.9 วิ","passive":false},{"id":"boxer_iron","cls":"muaythai","name":"กายเหล็กคาถามหาอุด","desc":"ลงคาถามหาอุด ป้องกัน +30% โจมตี +40% ฟื้น HP 10% นาน 10 วิ","passive":false},{"id":"boxer_hanuman","cls":"muaythai","name":"หนุมานถวายแหวน","desc":"สุดยอดคอมโบ 8 จังหวะ หมัด-ศอก-เข่า-เตะ ปิดด้วยแม่ไม้ปัดแล้วเสยหมัดคู่ขึ้นปลายคาง โดนทุกตัวด้านหน้า","passive":false},{"id":"sword_twin","cls":"warrior","name":"ฟันดาบคู่","desc":"ฟันไขว้ 3 ครั้ง โดนทุกตัวด้านหน้า เลือดไหลต่อเนื่อง","passive":false},{"id":"sword_thrust","cls":"warrior","name":"แทงทะลวง","desc":"พุ่งแทงให้มึน 0.5 วิ และลดเกราะ 30% 6 วิ เปิดช่องให้ทีม","passive":false},{"id":"sword_wind","cls":"warrior","name":"ดาบวายุ","desc":"คลื่นดาบทะลุแนว ช้าลง 25% 2 วิ เตรียมวงพิฆาต","passive":false},{"id":"sword_guard","cls":"warrior","name":"ตั้งการ์ดดาบคู่","desc":"[ปาร์ตี้] ป้องกัน +25 และ +15% 8 วิ · ท้าศัตรูใกล้ตัว 4 วิ","passive":false},{"id":"sword_pikat","cls":"warrior","name":"เพลงดาบพิฆาต","desc":"เพลงดาบ 6 ครั้ง · แรงขึ้น 15% ต่อเป้าที่ช้าหรือมึน","passive":false},{"id":"sword_banner","cls":"warrior","name":"ธงชัยเฉลิมพล","desc":"[ปาร์ตี้] ปักธงครุฑนำทัพ โจมตี +22% ป้องกัน +8 12 วิ","passive":false},{"id":"sword_whirl","cls":"warrior","name":"ดาบบาทวงจักร","desc":"หมุนดาบรอบตัว 3 รอบ ฟันทุกตัวรอบกาย","passive":false},{"id":"sword_leap","cls":"warrior","name":"กระโจนผ่าปฐพี","desc":"กระโดดฟาดดาบลงพื้น ทุกตัวในวงสะดุ้ง 1 วิ","passive":false},{"id":"sword_berserk","cls":"warrior","name":"โทสะขุนศึก","desc":"โจมตี +35% คริ +15% ตีเร็ว +15% 10 วิ","passive":false},{"id":"sword_execute","cls":"warrior","name":"ดาบประหารอสูร","desc":"ดาบประหารมึน 1.5 วิ · แรงขึ้น 20% ต่อเป้าที่เกราะแตกหรือเลือดไหล","passive":false},{"id":"arch_quick","cls":"hunter","name":"ศรคู่ฉับไว","desc":"ยิงศร 2 ดอกติดกันใส่เป้าเดียว คูลสั้น ยิงรัวได้","passive":false},{"id":"arch_poison","cls":"hunter","name":"สั่งกัด!","desc":"ศรหวีดหมายเป้า น้องหมาพุ่งงับกัดค้าง ตรึง 1.5 วิ เลือดไหล","passive":false},{"id":"arch_pierce","cls":"hunter","name":"ห่าศรพราน","desc":"ห่าศรลงเป็นวง โดนทุกตัวในวง · เก็บเลเวลทีละฝูง","passive":false},{"id":"arch_hawk","cls":"hunter","name":"ตาเหยี่ยว","desc":"ตีเร็ว +25% โจมตี +15% คริ +10% 10 วิ","passive":false},{"id":"arch_rain","cls":"hunter","name":"ฝูงหมาไล่ล่า","desc":"ฝูงหมากัด 3 รอบ · แรงขึ้น 15% ต่อเป้าที่เลือดไหลหรืออ่อนแรง","passive":false},{"id":"arch_garuda","cls":"hunter","name":"หมาเห่าข่มขวัญ","desc":"หมาเห่าข่มขวัญ มึน 1.5 วิ ลดพลังโจมตีศัตรู 20% 5 วิ","passive":false},{"id":"arch_volley","cls":"hunter","name":"ศรทะลวงแนว","desc":"ศรทะลุแนว ลดเกราะ 25% 5 วิ เปิดช่องให้ทีม","passive":false},{"id":"arch_trap","cls":"hunter","name":"กับดักดินระเบิด","desc":"กับดักระเบิดดินวงกว้าง หนามตรึงทุกตัว 1.6 วิ แล้วช้าลง 40% 3 วิ","passive":false},{"id":"arch_snipe","cls":"hunter","name":"ล่าคู่ศรเหยี่ยวราตรี","desc":"ศรเล็งแรงขึ้น 20% ต่อเป้าที่ช้าหรือเกราะแตก","passive":false},{"id":"arch_meteor","cls":"hunter","name":"ล่าล้างฝูง","desc":"ห่าศรล้างฝูง · แรงขึ้น 15% ต่อเป้าที่ช้าหรือไฟลุก","passive":false},{"id":"mage_akom","cls":"shaman","name":"กระสุนวิญญาณ","desc":"ยิงหัวกะโหลกวิญญาณ 3 ดวงโค้งเข้าเป้า","passive":false},{"id":"mage_yant","cls":"shaman","name":"โซ่ตรวนยมบาล","desc":"โซ่นรกพุ่งทะลุทุกตัว ตรึงศัตรูนิ่ง 1.8 วิ","passive":false},{"id":"mage_shield","cls":"shaman","name":"เกราะกระดูกผี","desc":"[ปาร์ตี้] เกราะกระดูกคุ้มเพื่อนใกล้ตัว ป้องกัน +18 นาน 6 วิ","passive":false},{"id":"mage_thunder","cls":"shaman","name":"มือมัจจุราช","desc":"มือผีกระชาก · แรงขึ้น 20% ต่อเป้าที่ติดพิษหรือเกราะแตก","passive":false},{"id":"mage_kalp","cls":"shaman","name":"ไฟนรกอเวจี","desc":"ไฟนรก 4 ระลอก · แรงขึ้น 15% ต่อเป้าที่ช้าหรืออ่อนแรง","passive":false},{"id":"mage_holy","cls":"shaman","name":"พิธีเซ่นผีบรรพบุรุษ","desc":"[ปาร์ตี้] ผีบรรพบุรุษคุ้มครองวง ฟื้น HP 15% + MP 15% ทั้งปาร์ตี้ · ป้องกัน +12 นาน 10 วิ","passive":false},{"id":"mage_ghostfire","cls":"shaman","name":"วิญญาณเร่ร่อนห้าดวง","desc":"ปลดปล่อยวิญญาณเร่ร่อน 5 ดวงพุ่งแผ่เป็นพัด โดนได้หลายตัว","passive":false},{"id":"mage_curse","cls":"shaman","name":"คำสาปตายโหง","desc":"คำสาปพิษและช้า · ลดพลังโจมตีและเกราะ 20% 5 วิ เปิดช่องให้ทีม","passive":false},{"id":"mage_meditate","cls":"shaman","name":"ฌานป่าช้า","desc":"นั่งสมาธิดูดพลังป่าช้า พลังเวทย์ +35% คริ +10% ฟื้น HP 10% นาน 12 วิ","passive":false},{"id":"mage_storm","cls":"shaman","name":"ประตูยมโลก","desc":"★ เปิดประตูนรกวงกว้างรอบตัว มือผีกระชาก 5 ระลอก ผีทั้งวงสะดุ้งทุกครั้ง","passive":false},{"id":"heal_vine","cls":"herbalist","name":"สายใยสมุนไพร","desc":"เถาสมุนไพรผูกเป้า ดูดพลังกลับมารักษาตัวเองและเพื่อนในปาร์ตี้ที่อยู่ใกล้ (ตามพลังเวทย์) นาน 6 วิ","passive":false},{"id":"heal_pill","cls":"herbalist","name":"ขวดยาเด้งห้าทิศ","desc":"ยาเด้งรักษาเพื่อนและโจมตีผี · แรงขึ้น 15% ต่อเป้าที่ช้าหรือติดพิษ","passive":false},{"id":"heal_zone","cls":"herbalist","name":"วงหนาดปราบผี","desc":"วงหนาดพิษและช้า · ลดพลังโจมตีศัตรู 10% 4 วิ","passive":false},{"id":"heal_tiger","cls":"herbalist","name":"ยาต้มพยัคฆ์เหิน","desc":"[ปาร์ตี้] ล้างสถานะ ป้องกัน +20% และโอกาสหลบ +10% 8 วิ เพิ่มตามเลเวลสกิล","passive":false},{"id":"heal_khwan","cls":"herbalist","name":"พิธีสู่ขวัญ","desc":"★ [ปาร์ตี้] บายศรีสู่ขวัญ รักษา 40% ทั้งปาร์ตี้รอบตัว · ชุบชีวิตเพื่อนที่สลบ","passive":false},{"id":"heal_mortar","cls":"herbalist","name":"ครกยาระเบิดสมุนไพร","desc":"ครกยารักษาทีม · แรงขึ้น 15% ต่อเป้าที่ติดพิษหรืออ่อนแรง","passive":false},{"id":"heal_mist","cls":"herbalist","name":"หมอกยาชโลมใจ","desc":"[ปาร์ตี้] พ่นหมอกยาหอม ฟื้น HP 18% + MP 10% ทั้งปาร์ตี้รอบตัว","passive":false},{"id":"heal_tonic","cls":"herbalist","name":"ยาบำรุงกำลังเจ็ดพลัง","desc":"[ปาร์ตี้] ลูกยา 7 สีโคจรแล้วพุ่งเข้าตัว โจมตี +18% ป้องกัน +15% ทั้งปาร์ตี้รอบตัว","passive":false},{"id":"heal_mother","cls":"herbalist","name":"พรแม่โพสพ","desc":"[ปาร์ตี้] ทุ่งข้าวทองงอกรอบตัว ฟื้น HP 45% + MP 20% ทั้งปาร์ตี้","passive":false},{"id":"heal_amrita","cls":"herbalist","name":"น้ำอมฤตชุบชีวา","desc":"[ปาร์ตี้] คนโททองเทน้ำอมฤต รักษา 60% ทั้งปาร์ตี้รอบตัว · ชุบชีวิตเพื่อนที่สลบ","passive":false},{"id":"sword_t_mastery","cls":"warrior","name":"ชำนาญดาบ","desc":"ติดตัว: ลับดาบคู่จนชินมือ พลังโจมตีกายภาพ +2% ต่อเลเวล","passive":true},{"id":"sword_t_breath","cls":"warrior","name":"ลมหายใจนักรบ","desc":"ติดตัว: หายใจเป็นจังหวะกลางวงล้อม HP +15 และหลบหลีก +1 ต่อเลเวล","passive":true},{"id":"sword_t_hide","cls":"warrior","name":"หนังเหนียว","desc":"ติดตัว: ร่างกายทนทานดั่งหนังควาย HP สูงสุด +3% และป้องกัน +1 ต่อเลเวล","passive":true},{"id":"boxer_t_wit","cls":"muaythai","name":"ไหวพริบนักมวย","desc":"ติดตัว: อ่านจังหวะคู่ต่อสู้ออก ความเร็วโจมตี +1.5% ต่อเลเวล","passive":true},{"id":"boxer_t_shin","cls":"muaythai","name":"ขาเหล็ก","desc":"ติดตัว: เตะต้นกล้วยจนหน้าแข้งแกร่ง พลังโจมตีกายภาพ +2% ต่อเลเวล","passive":true},{"id":"boxer_t_calm","cls":"muaythai","name":"จิตนิ่ง","desc":"ติดตัว: ใจนิ่งดั่งครูมวย MP +10 และป้องกัน +1 ต่อเลเวล","passive":true},{"id":"arch_t_eye","cls":"hunter","name":"สายตาพราน","desc":"ติดตัว: เล็งจุดตายได้แม่น อัตราคริ +1% และแรงคริ +2% ต่อเลเวล","passive":true},{"id":"arch_t_bow","cls":"hunter","name":"ธนูหนัก","desc":"ติดตัว: น้าวสายธนูได้ตึงกว่าใคร พลังโจมตีกายภาพ +2% ต่อเลเวล","passive":true},{"id":"arch_t_bond","cls":"hunter","name":"สายใยคู่หู","desc":"ติดตัว: น้องหมารู้ใจพราน หมากัดแรงขึ้น +4% ต่อเลเวล","passive":true},{"id":"mage_t_tongue","cls":"shaman","name":"ลิ้นอาคม","desc":"ติดตัว: ท่องคาถาคล่องปาก ลดคูลดาวน์สกิล −1% ต่อเลเวล","passive":true},{"id":"mage_t_fire","cls":"shaman","name":"ไฟในใจ","desc":"ติดตัว: เพลิงอาคมลุกในอก พลังเวทย์ +2% ต่อเลเวล","passive":true},{"id":"mage_t_barami","cls":"shaman","name":"บารมีผี","desc":"ติดตัว: ผีบรรพบุรุษหนุนหลัง MP สูงสุด +3% และป้องกัน +1 ต่อเลเวล","passive":true},{"id":"heal_t_recipe","cls":"herbalist","name":"ตำรับโอสถ","desc":"ติดตัว: ท่องตำรายาจนขึ้นใจ พลังรักษา +2.5% ต่อเลเวล","passive":true},{"id":"heal_t_venom","cls":"herbalist","name":"พิษสมุนไพร","desc":"ติดตัว: รู้จักยาพิษทุกชนิด พลังเวทย์ +2% ต่อเลเวล (ยาที่ปาใส่ผีแรงขึ้น)","passive":true},{"id":"heal_t_hands","cls":"herbalist","name":"มือทอง","desc":"ติดตัว: มือเบาปรุงยาไว MP +12 และฟื้นคืน MP สูงสุด +2% ต่อเลเวล","passive":true}];
const classes={muaythai:'มวยไทย',warrior:'นักรบ',hunter:'นายพราน',shaman:'หมอผี',herbalist:'หมอยา'};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(cls){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.class===cls)));document.querySelector('.grid').innerHTML=skills.filter(s=>s.cls===cls).map(s=>'<article class="card" title="'+escape(s.desc)+'"><span class="frame hero"><img src="/ui/skills/painted-complete-v1/'+s.id+'.webp" alt="'+escape(s.name)+'"></span><h2>'+escape(s.name)+'</h2><span class="type">'+(s.passive?'สกิลติดตัว':'สกิลใช้งาน')+'</span><div class="sizes">'+[32,48,64].map(n=>'<label><span class="frame s'+n+'"><img src="/ui/skills/painted-complete-v1/'+s.id+'.webp" alt=""></span>'+n+'px</label>').join('')+'</div></article>').join('');}
document.querySelector('nav').innerHTML=Object.entries(classes).map(([id,name])=>'<button type="button" data-class="'+id+'" aria-pressed="false">'+name+'</button>').join('');document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.class)});show('warrior');
</script></body></html>
