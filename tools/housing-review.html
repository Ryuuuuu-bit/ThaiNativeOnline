<header><small>THAI NATIVE · ARCHITECTURE</small><h1></h1><p>โมเดลจริง · กล้อง Orthographic 2.5D</p></header>
<nav><a href="?type=stiltHouse">เรือนไทย</a><a href="?type=shophouseRow">ห้องแถวร้านค้า</a></nav>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import * as shops from '/src/world/Architecture.js';
import {createRng} from '/src/world/rng.js';
import {PropLibrary} from '/src/world/props.js';
import {StaticBatcher} from '/src/world/Batching.js';
const q=new URLSearchParams(location.search),type=['stiltHouse','shophouseRow'].includes(q.get('type'))?q.get('type'):'stiltHouse';
const names={stiltHouse:'เรือนไทยในเมือง',shophouseRow:'ห้องแถวร้านค้า'};
const builders=shops;
document.querySelector('h1').textContent=names[type]+' · แบบปรับรายละเอียด';
const scene=new THREE.Scene();scene.background=new THREE.Color('#c5cfbd');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const camera=new THREE.OrthographicCamera(-9*innerWidth/innerHeight,9*innerWidth/innerHeight,9,-9,.1,80);camera.position.set(12,12,17);camera.lookAt(0,2,0);

window.shopReview={ready:true,type,metadata:model.userData,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles};
</script></html>
