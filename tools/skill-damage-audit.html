<!doctype html><div id="labels"></div><div id="dim"></div><canvas id="c"></canvas><script type="module">
import * as THREE from 'three';import {CLASS_KITS} from '/src/classes/index.js';import {createFx} from '/src/classes/fx/engine.js';import {castInfo} from '/src/training/kitCombat.js';import {SKILL_BY_ID} from '/src/rules/data/skills.js';import {KitCaster} from '/src/training/KitCaster.js';import {Character} from '/src/character/Character.js';import {Combat} from '/src/combat/Combat.js';import {skillHitSchedule} from '/src/rules/skillHits.js';
window.audit=(motion=false)=>{Math.random=()=>.5;const rows=[];for(const [cls,kit] of Object.entries(CLASS_KITS))for(const move of kit.skills)for(const pick of ['base','A','B'])for(const size of [1,3])for(const mode of ['close','range']){const eff=pick==='base'?move.id:move.id+'@'+pick;const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,4,8);camera.lookAt(0,0,0);const fx=createFx({scene,camera,renderer:{domElement:document.querySelector('canvas'),getPixelRatio:()=>1,compile:()=>{}},labels:document.querySelector('#labels')});scene.updateMatrixWorld(true);const range=mode==='close'?2.2:castInfo({id:eff},5).range;const player={group:new THREE.Group()};player.position=player.group.position;scene.add(player.group);const c=Character.create('FX audit',cls,'male');c.jobLevel=50;for(const id of c.kitSkills)c.skills[id]=5;if(pick!=='base')c.evo[move.id]=pick;c.mp=100000;c.hp=c.maxHp;
const combat=new Combat(c,{canStand:()=>true,playerPos:()=>player.position,moveTo(){},stop(){}},[{type:'boar',x:0,z:range,radius:0,count:1}]);combat.update(0);const m=combat.monsters[0];m.maxHp=10000000;m.hp=m.maxHp;m.def={...m.def,size,def:0,eva:0};combat.setTarget(m);const events=[];combat.on('hit',e=>events.push(e));let error=null,ok=false,otherDelta=0;try{const caster=new KitCaster({kit,fx,player,combat,character:c,canStand:()=>true,forceLevel:5,stats:()=>({...c.derived,patk:c.patk,matk:c.matk,critRate:0,accuracy:999}),dummy:()=>null,nearDummy:()=>false,dummyDefense:()=>({def:0,eva:0}),dummyRange:12,runnerFactory:(dummy,damage)=>kit.createSkills({fx,character:{attack(){},has:()=>false,tint(){}},player:player.group,dummy,groundHeight:()=>0,canStand:()=>true,labels:document.querySelector('#labels'),dim:document.querySelector('#dim'),damage})});ok=caster.cast(kit.skills.findIndex(s=>s.id===move.id),false);for(let i=0;i<480;i++){if(motion&&i===20){m.x=.25;const other={...m,id:999,hp:m.maxHp};combat.setTarget(other);caster.proxy.bind(caster.adapter(other));caster.auditOther=other;}caster.runner.update(1/60);caster.update(1/60);fx.update(1/60,i/60,0);scene.updateMatrixWorld(true)}otherDelta=caster.auditOther?caster.auditOther.maxHp-caster.auditOther.hp:0;}catch(e){error=e.stack}rows.push({cls,id:move.id,eff,size,mode,range,ok,hits:events.length,hpDelta:m.maxHp-m.hp,otherDelta,expectedHits:skillHitSchedule(move,eff).length,error,mult:SKILL_BY_ID[eff].mult??0});document.querySelector('#labels').replaceChildren();}return rows;};window.ready=true;
