<body class="hud-dynamic" style="background:#203e32"><main id="app"></main>
<script type="module">
import { ChatBox } from '/src/net/ChatBox.js';
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('ui-touch');
const chat = new ChatBox(() => {});chat.setStatus(true);chat.setOnline(12);

if (new URLSearchParams(location.search).has('admin')) {
  // Local UI fixture only. This page does not connect to the GM dispatcher.
  const { GM_COMMANDS } = await import('/server/gm-catalog.js');
  chat.setGmCatalog(GM_COMMANDS);
}
chat.open();window.gmReview={chat};
