<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Hunter companion model review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eee8da; color: #27392e; font: 15px system-ui, sans-serif; }
    main { width: 1000px; max-width: 100%; margin: auto; padding: 20px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p { margin: 0 0 12px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button, select { min-height: 44px; padding: 8px 14px; font: inherit; }
    canvas { display: block; width: 960px; max-width: 100%; height: auto; aspect-ratio: 4 / 3; }
    output { display: block; padding-top: 10px; overflow-wrap: anywhere; }
    .bad { color: #9c2525; }
  </style>
</head>
<body>
  <main>
    <h1>Hunter companion · model review</h1>
    <p id="source">Loading model…</p>
    <nav aria-label="Review controls">
      <select id="phase" aria-label="Animation state">
        <option>idle</option><option>trot</option><option>run</option><option>attack</option><option>bite</option><option>howl</option><option>glow</option>
      </select>
      <select id="view" aria-label="Camera view">
        <option>gameplay</option><option>three-quarter</option><option>front</option><option value="front-close">close front</option><option>side</option><option>back</option>
      </select>
      <button id="sample">Render fixed sample</button>
    </nav>
    <canvas width="960" height="720" aria-label="Hunter dog model canvas"></canvas>
    <output id="status" aria-live="polite">Loading…</output>
  </main>
  <script type="module" src="./review.js"></script>
</body>
</html>
