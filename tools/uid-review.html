<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/src/style.css"><link rel="stylesheet" href="/src/ui/theme.css"><link rel="stylesheet" href="/src/ui/layout.css"><link rel="stylesheet" href="/src/ui/touch.css"><body style="background:#243c30"><main id="app"><div id="hud"></div></main><script type="module">
import {showCharacterSelect} from '/src/account/screens.js';import '/src/account/account.css';import {CharacterUI} from '/src/character/ui/CharacterUI.js';import {Character} from '/src/character/Character.js';import {setIdentity} from '/src/account/identity.js';import {uidRow} from '/src/account/UidRow.js';
const params=new URLSearchParams(location.search),guest=params.has('guest');if(innerWidth<600)document.body.classList.add('ui-touch','ui-portrait');
const accountUid=guest?null:'ACC-0123456789ABCDEF0123456789ABCDEF',characterUid=guest?null:'CHR-FEDCBA9876543210FEDCBA9876543210';setIdentity({accountUid,characterUid});
if(params.get('view')==='sheet'){const ui=new CharacterUI(document.querySelector('#hud'),Character.create('ผู้เดินทาง','warrior','male'),{log(){}});ui.toggle('sheet');window.uidReview={ui};}
else if(params.get('view')==='settings'){const panel=document.createElement('section');panel.className='settings glass';panel.innerHTML='<div class="panel-heading">ตั้งค่า</div><div class="set-body"><div class="set-pane">บัญชี</div></div>';panel.append(uidRow('Account UID',accountUid,'ACC'));document.querySelector('#app').append(panel);window.uidReview={panel};}
else {const store={accountUid,slots:()=>Array.from({length:3},(_,slot)=>({slot,prefix:'fixture',character:null})),deleteSlot(){}};showCharacterSelect(document.querySelector('#app'),store,{id:'ผู้เดินทาง',guest});window.uidReview={store};}
</script></body></html>
